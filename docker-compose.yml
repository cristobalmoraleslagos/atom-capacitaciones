version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: atom_postgres
    environment:
      POSTGRES_USER: atom_admin
      POSTGRES_PASSWORD: atom_secure_password_2026
      POSTGRES_DB: atom_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atom_admin -d atom_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atom_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atom_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@atomcapacitaciones.cl
      PGADMIN_DEFAULT_PASSWORD: admin2026!
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  redisdata:
  pgadmin_data:
